name: Test

# Testler yalnızca dev dalında yaşar (bkz. guard-main.yml), bu yüzden burada da dev izlenir.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test
