name: Guard main

# main'e yalnızca üretim kodu girer. Testler (test/ ve "test" script'i) dev dalında kalır.
on:
  pull_request:
    branches: [main]

jobs:
  no-dev-only-files:
    name: no-dev-only-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block dev-only files
        run: |
          set -eu
          bad=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^test/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Bu PR main'e girmemesi gereken dosyalar içeriyor:"
            echo "$bad"
            exit 1
          fi
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts?.test ? 0 : 1)"; then
            echo "::error::package.json içindeki \"test\" script'i main'e girmemeli."
            exit 1
          fi
          echo "OK"
