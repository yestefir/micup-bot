name: Guard main

# main'e yalnızca üretim kodu girer. Testler (test/ ve "test" script'i), scripts/ ve test.yml dev dalında kalır.
# PR dalını scripts/release-branch.sh hazırlar.
on:
  pull_request:
    branches: [main]

jobs:
  no-dev-only-files:
    name: no-dev-only-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block dev-only files
        run: |
          set -eu
          bad=$(git ls-tree -r --name-only HEAD -- test scripts .github/workflows/test.yml)
          if [ -n "$bad" ]; then
            echo "::error::Bu PR main'e girmemesi gereken dosyalar içeriyor:"
            echo "$bad"
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const { scripts } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (Object.hasOwn(scripts ?? {}, 'test')) {
            console.error('::error::package.json içindeki "test" script\'i main\'e girmemeli.');
            process.exitCode = 1;
          }
          NODE
          echo "OK"
